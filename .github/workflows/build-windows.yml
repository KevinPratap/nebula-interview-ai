name: Build Windows Release

# Builds the real Windows artifacts (installer + portable .exe) on an actual
# Windows runner. This cannot be done from a Linux machine/container: the
# Python sidecar is frozen with PyInstaller, which only produces a binary for
# the OS it runs on, and it depends on Windows-only audio backends (pyaudio's
# WASAPI loopback, soundcard). Cross-compiling either half from Linux is not
# supported, so this workflow is the actual build path for a downloadable .exe.

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python sidecar dependencies
        run: pip install -r requirements-sidecar.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Build Python sidecar (engine_sidecar.exe)
        run: npm run build:sidecar

      - name: Build Electron app + installer/portable .exe
        run: npm run dist:all

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nebula-windows-${{ github.run_number }}
          path: |
            dist_electron/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach to GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist_electron/*.exe
          # Tags containing "-ci" (used for on-demand build tags, not real version
          # releases) are published as drafts so they don't show up as the repo's
          # latest release — delete the tag/release once you've grabbed the .exe.
          draft: ${{ contains(github.ref_name, '-ci') }}
          prerelease: ${{ contains(github.ref_name, '-ci') }}
